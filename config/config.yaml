# PuzzleVision — единый файл порогов и весов конвейера.
# Каждый модуль сервера читает свой раздел через app.core.config.get_config().
# Значения в разделах, помеченных "этап N", используются начиная с соответствующего
# этапа разработки; до этого они не влияют ни на что и служат заготовкой конфигурации.

server:
  host: "0.0.0.0"
  port: 8443
  # Пути ищутся относительно корня репозитория, если не абсолютные.
  tls_certfile: "certs/server.crt"
  tls_keyfile: "certs/server.key"
  data_dir: "data/puzzles"
  debug_dir: "data/debug"
  # Писать ли отладочные изображения (маски, углы, стороны, привязка) для каждого кадра.
  debug_images: true
  database_url: "sqlite:///data/puzzlevision.db"
  cors_allow_origins: ["*"]

capture:
  # Протокол съёмки партии деталей (Этап Б технического задания).
  batch_size_min: 60
  batch_size_max: 120
  table_height_cm_min: 50
  table_height_cm_max: 70
  min_gap_mm: 10          # минимальный зазор между деталями при раскладке
  max_gap_mm: 15
  min_camera_megapixels: 12
  max_frames_total: 80

aruco:
  dictionary: "DICT_4X4_50"
  marker_id: 0
  marker_size_mm: 100      # сторона маркера на печатном A4-листе
  page_size: "A4"

preprocess:
  # Порог дисперсии Лапласиана: кадры ниже отбраковываются как размытые.
  blur_variance_threshold: 80.0
  # Доля пересвеченных пикселей (яркость > overexposure_luma), выше — отбраковка.
  overexposure_luma: 245
  overexposure_fraction_threshold: 0.05
  # Белый лист A4 вокруг маркера легитимно близок к 255 по яркости и не должен
  # засчитываться как пересвет — исключаем квадрат вокруг маркера такого
  # размера (в сторонах маркера) из статистики пересвета.
  overexposure_marker_exclusion_factor: 3.5
  # Целевые серые/белые поля маркера для баланса белого.
  white_balance_reference_patch: "aruco_border"
  homography_output_dpi: 300
  # Разрешение прямоугольного (top-down) кадра после выпрямления по маркеру.
  output_px_per_mm: 6.0
  # Отступ от края холста до маркера в выпрямленном кадре (чтобы детали
  # рядом с маркером не обрезались).
  output_margin_mm: 20.0
  # Верхняя граница стороны выпрямленного кадра (защита от аномальных гомографий).
  max_output_canvas_px: 8000
  # Множитель клампа коэффициента баланса белого (защита от переусиления в тёмных кадрах).
  white_balance_gain_clamp: [0.5, 2.0]
  # Кольцо вокруг маркера (в мм), по которому оценивается белый цвет листа A4.
  white_balance_ring_mm: 15.0

segment:
  # background_method: color_threshold — дешёвый первый проход по цветовому
  # порогу от фона (работает на однотонном столе); sam2 — точная сегментация
  # для сложных случаев (см. segment.sam2, реализуется отдельно, по умолчанию выключена).
  background_method: "color_threshold"   # color_threshold | sam2
  area_tolerance_fraction: 0.4           # ±40% от медианной площади детали
  cluster_area_ratio_threshold: 2.0      # маска крупнее медианы в N раз -> слипшиеся детали
  watershed_min_distance_px: 15
  # Порог отличия пикселя от фона в Lab (евклидово расстояние), выше — деталь.
  background_color_distance_threshold: 22.0
  # Размер структурного элемента морфологии (open+close) в мм — убирает шум,
  # сохраняя тонкие "шейки" выступов.
  morph_kernel_mm: 1.2
  # Минимальная площадь компонента в мм² — отсекает шумовые пятна фона.
  min_component_area_mm2: 8.0
  # Небольшой гарантированный отступ вокруг маркера (на случай, если лист
  # обрезан вплотную и заливку по белому найти не удалось).
  marker_exclusion_margin_mm: 8.0
  # Реальная граница белого листа A4 определяется заливкой по яркости от
  # маркера наружу (см. segment._marker_paper_region) — не фиксированным
  # отступом, чтобы не отрезать настоящие детали рядом с маркером. Это
  # радиус ПОИСКА (сколько максимум может занимать белое поле), а не
  # гарантированный отступ.
  marker_paper_search_margin_mm: 90.0
  # Деталь, чей контур ближе к краю кадра, чем это значение (мм), считается
  # обрезанной краем кадра -> помечается сомнительной.
  frame_border_margin_mm: 5.0
  # Субпиксельное уточнение контура (середина перепада «деталь -> фон» вдоль
  # нормали): пиксельный контур даёт шум ~0.17 мм — того же порядка, что
  # различия формы замков; с уточнением истинный сосед по форме выделяется
  # в ~6 раз надёжнее (см. segment.refine_contour_subpixel).
  subpixel_contour: true
  sam2:
    enabled: false
    checkpoint: "models/sam2_hiera_small.pt"
    points_per_side: 0    # 0 = использовать точки-подсказки из первого прохода, не сетку

describe:
  # Углы — точки, из которых контур уходит двумя прямыми «плечами» под ~90°
  # (см. describe._find_corners): длина плеча — доля оценки стороны детали
  # sqrt(площади); из лучших кандидатов перебором выбирается четвёрка,
  # образующая согласованный прямоугольник.
  corner_arm_fraction: 0.14
  corner_resample_points: 360
  corner_max_candidates: 12
  # Максимальное отклонение углов найденного четырёхугольника от 90° —
  # выше деталь помечается сомнительной (non_rectangular). После перехода
  # на уточнённые пересечением плеч углы типичное отклонение — единицы
  # градусов.
  corner_rectangularity_tolerance_deg: 20
  side_curve_points: 96          # 64-128 точек нормализованной кривой стороны
  color_strip_width_mm: 4.0      # 3-5 мм цветовая полоса вдоль края
  color_strip_samples: 32
  color_space: "Lab"
  embedding_model: "dinov2_vits14"   # реальная модель подключается на этапе 2 (locate)
  # Порог доли максимального отклонения контура стороны от прямой линии
  # (относительно длины стороны) — ниже считается прямым краем.
  straight_side_deviation_ratio: 0.06

locate:
  # Деталь переносится по своим 4 углам в систему координат ячейки образца
  # и сравнивается со ВСЕМИ ячейками в 4 поворотах (см. locate.py) — без
  # предотбора кандидатов. Окно сравнения — ячейка плюс поле pad с каждой
  # стороны (доля стороны ячейки): туда попадают выступы детали.
  pad_fraction: 0.3
  # Дескриптор — сетка NxN средних цветов по окну (ячейка+поле).
  descriptor_grid: 12
  # Веса каналов Lab (L, a, b) в стоимости: яркость сильнее всего искажается
  # освещением стола, поэтому её вес снижен (подобрано на синтетике: 0.15
  # лучше 0.5 и 1.0 в однотонных зонах, в текстурных без разницы).
  lab_weights: [0.15, 1.0, 1.0]
  # Деталь «уверенная», если стоимость второй лучшей ячейки в N раз больше
  # лучшей: по таким деталям оценивается освещение (и они же — якоря
  # сборки). На синтетике 2000 деталей все такие детали стояли верно.
  anchor_margin: 2.0
  # Попартийная коррекция освещения (линейное поле усиления BGR по кадру).
  lighting_correction: true
  lighting_min_samples: 10
  # Цветовая модель образца (картинка коробки -> вид деталей на фото):
  # полином 2-й степени по цвету + градиент засветки, по якорям.
  reference_color_correction: true
  reference_color_min_anchors: 30
  # Сколько раз чередовать «цвет образца» <-> «освещение кадров».
  color_rounds: 2
  top_k_result_cells: 3
  # Размер уменьшенного превью детали для отладочного рендера сборки.
  preview_canvas_px: 48

match:
  # Совместимость сторон S = w_shape*D_shape/shape_scale + w_color*D_color/color_scale.
  weights:
    shape: 0.7
    color: 0.3
    position: 0.0
  # Типичное расстояние формы для верной пары (мм) и типичный ΔE кромки —
  # нормировки для score_side_pair (в глобальной сборке масштаб формы
  # оценивается по якорям автоматически).
  shape_scale_mm: 0.2
  color_scale_delta_e: 8.0
  # ICP-совмещение кривых сторон (см. match.py).
  icp_iterations: 4
  icp_window: 6            # окно поиска соответствий вдоль кривой, точек плотной кривой
  icp_dense_points: 192    # плотная передискретизация кривой-партнёра
  icp_subsample: 2         # прореживание «своей» кривой (96 -> 48 точек)
  confidence_candidate_threshold: 0.80   # ниже — показываем 2-3 кандидата

solve:
  # Глобальная сборка (solve.py): якоря по образцу + рост по совместимости сторон.
  anchor_margin: 2.0
  # Сколько лучших по образцу (деталь, поворот) проверять формой на ячейку —
  # уже ПОСЛЕ фильтра по типам замков под стоящих соседей.
  candidates_per_cell: 60
  shape_weight: 1.0           # вес формы сторон относительно сходства с образцом
  neighbor_bonus: 0.5         # приоритет ячеек, где стыкуются сразу несколько соседей
  # Стык с соседом неправдоподобен, если расстояние формы превышает типичное
  # для верной пары (медиана по якорям) больше чем на N её разбросов (MAD).
  max_edge_sigma: 4.0
  # Циклы «снять детали с неправдоподобными стыками -> дорастить».
  repair_rounds: 4
  # Финальный локальный поиск (обмены/замены деталей) по энергии раскладки.
  refine_rounds: 6
  refine_candidates: 40       # (деталь, поворот) на ячейку, после фильтра по типам замков
  refine_min_gain: 0.5        # минимальное уменьшение энергии, чтобы принять ход
  mismatch_energy: 30.0       # штраф стыка выступ-выступ / впадина-впадина
  empty_energy: 3.0           # стоимость пустой ячейки сверх «нулевой гипотезы»
  # «Нулевая гипотеза» (верной детали среди кандидатов нет): сходство с
  # образцом на уровне N * sigma_A и стыки на null_edge_sigma разбросов
  # хуже типичного для верной пары.
  null_appearance: 6.0
  null_edge_sigma: 2.5
  # Рост ставит деталь, только если вероятность лучшего кандидата не ниже
  # порога; пороги снижаются ступенями (сначала самые надёжные ячейки).
  growth_min_prob: [0.9, 0.6, 0.3]

plan:
  priority_confidence_weight: 0.7
  priority_convenience_weight: 0.3
  frame_first: true               # сначала рамка, потом текстурные острова, потом однотонные зоны

recognize:
  faiss_index_type: "IVFFlat"
  fingerprint_rotation_invariant: true

no_reference:
  cluster_method: "dinov2_kmeans"
  min_island_size: 10
  faiss_top_k_shape: 20
  candidates_shown: 5

synth:
  # Параметры генератора синтетического датасета (используется тестами всех этапов).
  piece_size_mm: 25.0
  default_aspect_ratio: [4, 3]
  table_canvas_margin_mm: 40.0
  background_color_bgr: [40, 34, 30]
  lighting_gradient_strength: 0.25
  noise_sigma: 4.0
  jpeg_quality: 92
  seed: 42
  tab_shape:
    # classic — грибовидный замок с шейкой (как у настоящих пазлов),
    # bump — упрощённый горб без шейки (прежняя форма, для сравнения).
    style: "classic"
    tab_size: 0.1              # размер замка (доля стороны), головка ~0.3 стороны
    jitter: 0.035              # индивидуальная асимметрия каждого ребра
    # параметры style=bump:
    depth_ratio: 0.24          # глубина выступа/впадины относительно размера детали
    center_jitter: 0.06        # случайное смещение центра выступа от середины стороны
    half_width_ratio: 0.27     # ширина "бульбы" относительно длины стороны
    waist_w_ratio: 0.06        # ширина сужения-шейки
    waist_depth_ratio: 0.08    # глубина сужения относительно depth_ratio
    depth_jitter: 0.15         # случайный разброс глубины между деталями
    side_curve_points: 96      # точек на кривую стороны в каталоге пазла
